basePath: /
definitions:
  httpHandler.appointmentJSON:
    properties:
      created_at:
        example: "2025-01-10T08:00:00Z"
        type: string
      customer_id:
        example: c1a2b3c4-d5e6-7890-abcd-ef1234567890
        type: string
      dealership_id:
        example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        type: string
      end_time:
        example: "2025-01-15T10:15:00Z"
        type: string
      id:
        example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        type: string
      notes:
        example: ""
        type: string
      services:
        items:
          $ref: '#/definitions/httpHandler.serviceSnapshotJSON'
        type: array
      start_time:
        example: "2025-01-15T09:00:00Z"
        type: string
      status:
        example: pending
        type: string
      vehicle_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
    type: object
  httpHandler.availableSlotsResponse:
    properties:
      available_slots:
        items:
          $ref: '#/definitions/httpHandler.slotJSON'
        type: array
    type: object
  httpHandler.bookAppointmentRequest:
    properties:
      customer_id:
        example: c1a2b3c4-d5e6-7890-abcd-ef1234567890
        type: string
      dealership_id:
        example: d1e2f3a4-b5c6-7890-abcd-ef1234567890
        type: string
      desired_start_time:
        example: "2025-01-15T09:00:00Z"
        type: string
      services:
        example:
        - oil_change
        - tire_rotation
        items:
          type: string
        minItems: 1
        type: array
      vehicle_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
    required:
    - customer_id
    - dealership_id
    - desired_start_time
    - services
    - vehicle_id
    type: object
  httpHandler.bookAppointmentResponse:
    properties:
      appointment_id:
        example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        type: string
      duration_minutes:
        example: 75
        type: integer
      message:
        example: Appointment booked successfully
        type: string
    type: object
  httpHandler.errorResponse:
    properties:
      error:
        example: dealership not found
        type: string
    type: object
  httpHandler.listAppointmentsResponse:
    properties:
      appointments:
        items:
          $ref: '#/definitions/httpHandler.appointmentJSON'
        type: array
    type: object
  httpHandler.serviceSnapshotJSON:
    properties:
      estimated_minutes:
        example: 30
        type: integer
      name:
        example: Oil Change
        type: string
      price:
        example: 49.99
        type: number
      service_id:
        example: oil_change
        type: string
    type: object
  httpHandler.slotJSON:
    properties:
      end:
        example: "2025-01-15T10:00:00Z"
        type: string
      start:
        example: "2025-01-15T09:00:00Z"
        type: string
    type: object
  httpHandler.updateAppointmentRequest:
    properties:
      notes:
        type: string
      status:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: RESTful API for booking vehicle service appointments at dealerships.
  title: Keyloop Appointment Booking API
  version: "1.0"
paths:
  /api/v1/appointments:
    get:
      description: Returns appointments filtered by customer_id or dealership_id (one
        is required)
      parameters:
      - description: Customer UUID
        in: query
        name: customer_id
        type: string
      - description: Dealership UUID
        in: query
        name: dealership_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpHandler.listAppointmentsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
      summary: List appointments
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: Create a new service appointment at a dealership for the chosen
        time slot
      parameters:
      - description: Appointment details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpHandler.bookAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpHandler.bookAppointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
      summary: Book an appointment
      tags:
      - appointments
  /api/v1/appointments/{id}:
    delete:
      description: Cancels and archives an appointment; only pending or confirmed
        appointments can be deleted
      parameters:
      - description: Appointment UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
      summary: Soft-delete an appointment
      tags:
      - appointments
    patch:
      consumes:
      - application/json
      description: Update the status and/or notes of an existing appointment; at least
        one field is required
      parameters:
      - description: Appointment UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpHandler.updateAppointmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpHandler.appointmentJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
      summary: Update an appointment
      tags:
      - appointments
  /api/v1/appointments/available-slots:
    get:
      description: Returns available 30-minute time slots within 7 days of desired_time
        where a bay and qualified technician are both free
      parameters:
      - description: Dealership UUID
        in: query
        name: dealership_id
        required: true
        type: string
      - description: Vehicle UUID
        in: query
        name: vehicle_id
        required: true
        type: string
      - description: Customer UUID
        in: query
        name: customer_id
        required: true
        type: string
      - collectionFormat: multi
        description: Service type identifiers (repeatable)
        in: query
        items:
          type: string
        name: services
        required: true
        type: array
      - description: Desired start datetime (RFC3339)
        in: query
        name: desired_time
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpHandler.availableSlotsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpHandler.errorResponse'
      summary: List available slots
      tags:
      - appointments
swagger: "2.0"
