version: "2"
sql:
  - schema: "../migration"
    queries: "queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "../infrastructure/postgresql/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "integer[]"
            go_type:
              import: "github.com/lib/pq"
              type: "Int64Array"
