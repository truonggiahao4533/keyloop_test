services:
#Application
  app:
    image: keyloop-test
    container_name: keyloop-test-app
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT}
      REDIS_ADDR: ${REDIS_ADDR}
    networks:
      - keyloop-test-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

#Migrations
  migrate:
    image: migrate/migrate
    container_name: keyloop-test-migrate
    networks:
      - keyloop-test-network
    volumes:
      - ./migration:/migration
    command: >
      -path=/migration
      -database postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      up
    depends_on:
      postgresql:
        condition: service_healthy

#Postgres 
  postgresql:
    image: postgres:15.3
    container_name: keyloop-test-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - keyloop-test-postgresql-data:/var/lib/keyloop-test/postgresql-data
    networks:
      - keyloop-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7.2.0
    container_name: keyloop-test-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - keyloop-test-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Observability (optional) ---

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "4317:4317"   # OTLP gRPC (traces)
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
    networks:
      - keyloop-test-network
    profiles:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - keyloop-test-network
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - keyloop-test-network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - keyloop-test-network
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - tempo
      - loki
    profiles:
      - observability


volumes:
  keyloop-test-postgresql-data:
    name: keyloop-test-postgresql-data
  tempo-data:
networks:
  keyloop-test-network:
    driver: bridge
    name: keyloop-test-network
